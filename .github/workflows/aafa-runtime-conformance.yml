name: AAFA Runtime Conformance

on:
  push:
    branches: ["main", "aafa/**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 experimental/aafa_runtime/test_runtime.py
